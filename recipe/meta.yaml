{% set name = "dbt-common" %}
{% set version = "1.39.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 868256ab2b59328efdd455644172ad17303f3f6a78a015f06667e865e068d620

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - agate >=1.7.0,<1.10
    - colorama >=0.3.9,<0.5
    - dbt-protos >=1.0.410,<2.0.0
    - deepdiff >=7.0,<9.0
    - isodate >=0.6,<0.8
    - jsonschema >=4.0,<5.0
    - jinja2 >=3.1.3,<4
    # mashumaro[msgpack] >=3.9,<4.0
    - mashumaro >=3.9,<4.0
    # https://github.com/Fatal1ty/mashumaro/blob/v3.22/pyproject.toml#L34
    - msgpack-python >=0.5.6
    - pathspec >=0.9,<1.1
    - protobuf {{ libprotobuf }}
    - python-dateutil >=2.0,<3.0
    - requests <3.0.0
    - typing-extensions >=4.4,<5.0
    - opentelemetry-api >=1.26,<3.0

test:
# Tests not included in pypi source, and github has no tagged releases.
  imports:
    - dbt_common
  # pip check omitted: PyPI dbt-common {{ version }} requires protobuf <7.0 in
  # requires_dist, so pip check fails when the test env installs protobuf 7.x
  # (PKG-15573). Restore the commands block once upstream metadata allows it.
  # commands:
  #   - pip check
  requires:
    - pip

about:
  home: https://github.com/dbt-labs/dbt-common
  summary: The shared common utilities that dbt-core and adapter implementations use.
  description: The shared common utilities for dbt-core and adapter implementations use.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  dev_url: https://github.com/dbt-labs/dbt-common
  doc_url: https://github.com/dbt-labs/dbt-common/tree/main/docs

extra:
  recipe-maintainers:
    - conda-forge/dbt
    - rxm7706
  skip-lints:
    - cbc_dep_in_run_missing_from_host
    - missing_pip_check
